mode: paper
ticker: KRW-BTC
strategy:
  k: 0.5
  ma_period: 5
trade:
  invest_ratio: 0.5
  fee: 0.0005
  min_order_krw: 5000
loop:
  interval_sec: 10
ai:
  enabled: true
  model: claude-haiku-4-5
  min_confidence: 60
  min_interval_sec: 900
  regime_interval_sec: 900   # AI 장세 재판단 주기(초). 장세는 천천히 바뀌니 길게=비용절감
  news_max_items: 12
  news_cache_sec: 900
  bear_defensive: true       # BEAR 장세: UP(추세추종) 차단, 박스+반등만 허용(false면 완전현금)
                             #   검증: 약세장 UP차단 시 일평균 -0.003%→+0.015%(박스가 유일 수익원)
  bear_size_mult: 1.0        # BEAR 진입 크기 배수(박스는 저위험 단타라 1.0 권장, 더 보수적이면 ↓)
news_feeds:
- https://www.coindesk.com/arc/outboundfeeds/rss/
- https://cointelegraph.com/rss
- https://decrypt.co/feed
timeframe_min: 15
indicators:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi: 14
  atr: 14
  adx: 14
  bb: 20
  bb_mult: 2.0
regime:
  adx_trend: 20
scalp:
  min_profit_buffer: 0.002
  max_hold_bars: 480
  confirm_bars: 3
  exit_on_down: true         # DOWN 확정전환 시 보유분 즉시청산(=V1 '청산 후 대기'). false=홀드(약세장 최악)
  bull_mode:                 # AI=BULL 확신도에 따라 상승장 강도 3단(강함/적당/그외). 약세/횡보엔 적용 안 됨.
    enabled: true            #   근거(BTC/USD 프록시): 불장 적용 시 보수대비 큰 폭 개선. AI게이트로만 분기.
    min_confidence: 60       # 이 미만이면 보수(박스/방어). 60~strong 사이=적당(중도), strong 이상=강함(공격)
    strong_confidence: 75    # 이 이상 확신이면 풀 공격
    require_adx_rising: false # [강함] 진입필터 완화 → 추세 적극 참여
    trail_pct: 0.05          # [강함] 트레일 넓게(승자 길게) — KRW 불장 실검증: 4%+2.49→6%+3.36%/코인(넓을수록↑)
                             #   6%는 단일구간 과적합 우려→robust 균형 5%. 손절 2%가 적정(더 좁히면 좋은추세 조기컷)
    hold_through_down: true  # [강함] 눌림목 DOWN플립에 홀드(안 팖)
    pyramid: true            # [강함] 불타기 ON: 남은 보루(75%)를 '오르는 승자'에 추가 투입
                             #   검증(BTC 불장): 단일50만 +4.6%/MDD-2.3 → 불타기 +9.7%/MDD-4.2 (위험대비 최고)
    pyramid_step: 0.03       #   직전 진입가 +3% 추가상승마다 1트랜치 (robust 튜닝: 8구간 전부+ , 수익/MDD 2.47)
                             #   (적당/약한 상승엔 미적용=보루 유지)
    moderate:                # [적당] 60~75 확신: 선별 진입 + 추세 + 안전망
      require_adx_rising: true   #   ADX 켜서 가짜추세 컷(선별 진입) — 적당불장은 신중하게
      trail_pct: 0.03            #   trail 살짝 넓게(보수 2.5%→3%)로 추세 조금 더 탐
      hold_through_down: false   #   DOWN 청산 유지(적당불장이 가짜로 판명나면 빠짐=안전망)
  uptrend:                   # 상승장 진입 (검증결과 trail이 fixed 30조합 전부 이김)
    enabled: true
    mode: trail              # trail=추세 길게 타기(승자) | fixed=작게 자주먹기
    require_adx_rising: true  # 추세 강해지는 중(ADX↑)일 때만 진입=가짜추세 컷.
                              #   상승장 +1.85→+2.45%, 약세장 -3.30→-2.11% 둘다 개선
    pyramid: false           # 불타기(오르는 포지션에 추가매수). 구현완료·검증결과 15m 구간선
                             #   OFF와 동률~손해(촘촘하면 트레일에 더 깎임)→기본 OFF. 강추세 검증 후 ON 고려
    pyramid_step: 0.04       # ON일 때: 직전 진입가 +4% 추가상승마다 1트랜치(촘촘하면 역효과)
    sl_pct: 0.02             # 초기 손절 -2%
    trail_pct: 0.025         # 고점 대비 -2.5% 되돌림에 청산(승자를 길게)
    tp_pct: 0.011            # fixed 모드용 익절(미사용)
  sideways:                  # 횡보장: 박스권 반복 신호 발라먹기(여러 번 왕복)
    mode: range
    require_bounce: true     # 하단에서 '직전봉 고가 돌파'(반등확인) 때만 진입 = 떨어지는 칼 회피.
                             #   검증(BTC): 횡보 -0.40%→+0.32%, 약세 -0.77%→-0.27%, MDD 2.7배↓. 구조개선(과적합 아님)
    box_lookback: 40
    min_box_pct: 0.015
    max_box_pct: 0.06
    entry_zone: 0.25         # 박스 하단 진입(0.35는 약세장↑ 상승장↓ 트레이드오프→상승보존 위해 0.25)
    tp_zone: 0.9             # 박스 상단 목표(단, quick_tp_pct로 더 작게 캡)
    quick_tp_pct: 0.005      # 빠른 익절: 수수료 넘으면 +0.5%서 바로 턴다(작게 자주, 손실일 차단)
    sl_below: 0.004
    tp_pct: 0.005
    sl_pct: 0.004
    rsi_buy: 32
    require_above_slow: true
  downtrend:                 # 하락장(DOWN): 관망/대기 (신규진입 없음, SIDEWAYS 복귀까지 현금)
    enabled: false           # V1 채택: DOWN 과매도반등(칼받기) 끔 → BTC프록시 약세장 일손실 -0.094→-0.052%,
                             #   횡보장도 개선·상승장 영향미미. 박스(SIDEWAYS) 수익엔진은 유지. exit_on_down=true와 함께.
                             #   (true로 켜면: 깊은과매도 RSI22 반등단타 +3% — KRW검증선 '작지만+'였음)
    tp_pct: 0.03             # +3% 목표 (작게잡으면 수수료+가끔손절에 깨짐)
    sl_pct: 0.008            # 손절 -0.8%
    rsi_buy: 22              # 깊은 과매도에서만(27→22). 얕으면 반등실패로 대량손실
portfolio:
  total_krw: 20000000        # 총자본 2,000만원
  per_coin_krw: 2000000      # 종목당 200만원
  tickers:                   # 원화마켓 시총/거래량 상위 메이저 10
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  - KRW-ADA
  - KRW-DOGE
  - KRW-TRX
  - KRW-LINK
  - KRW-AVAX
  - KRW-DOT
  tranches: 4                # 4분할 균등 (종목당 50만원씩) — 상승/약세 균형점
                             #   3분할=상승최적(+2.14/-2.17), 5분할=약세최적(+1.28/-1.47)
  add_drop_pct: 0.02         # 추가매수 트리거: 직전 진입가 대비 -2% 이상 하락 + 신호 재확인(둘 혼합)
  tp_pct: 0.02               # 평단가 대비 익절(+2%)
  hard_sl_pct: 0.06          # 모든 트랜치 소진 후에만 작동하는 평단가 대비 방어 손절(-6%)
  max_hold_bars: 480         # 보유 한도(타임아웃 청산)
paper:
  initial_krw: 1000000
upbit:
  access_key: ''
  secret_key: ''
