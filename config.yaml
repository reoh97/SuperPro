mode: paper
ticker: KRW-BTC
strategy:
  k: 0.5
  ma_period: 5
trade:
  invest_ratio: 0.5
  fee: 0.0005
  min_order_krw: 5000
loop:
  interval_sec: 10
market_gate:                 # ★ 차트 시장게이트(AI 대체, 검증가능·공짜) — 새틀 약세장 정지
  enabled: true              # BTC 200일선+기울기로 약세 감지 → 새틀 신규진입 전면 차단
  ticker: KRW-BTC            # 시장 대표(BTC가 시장 방향을 끌음)
  ma_n: 200                  # 200일선
  slope_n: 20                # 기울기 측정 구간(일). 종가<200MA AND 200MA 20일전보다 하락 = 약세
  interval_sec: 3600         # 1시간마다 BTC 일봉 체크(일봉이라 충분)
                             #   검증: 약세만 정확히 정지(횡보는 살림) → 새틀 +13.9%→+18.6%
ai:
  enabled: false             # ★ AI 게이트 OFF — 차트 시장게이트(위)로 대체(백테스트 가능·비용0).
  model: claude-haiku-4-5
  min_confidence: 60
  min_interval_sec: 900
  regime_interval_sec: 900   # AI 장세 재판단 주기(초). 장세는 천천히 바뀌니 길게=비용절감
  news_max_items: 12
  news_cache_sec: 900
  bear_defensive: true       # BEAR 장세: UP(추세추종) 차단, 박스+반등만 허용(false면 완전현금)
                             #   검증: 약세장 UP차단 시 일평균 -0.003%→+0.015%(박스가 유일 수익원)
  bear_size_mult: 1.0        # BEAR 진입 크기 배수(박스는 저위험 단타라 1.0 권장, 더 보수적이면 ↓)
news_feeds:
- https://www.coindesk.com/arc/outboundfeeds/rss/
- https://cointelegraph.com/rss
- https://decrypt.co/feed
timeframe_min: 15
indicators:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi: 14
  atr: 14
  adx: 14
  bb: 20
  bb_mult: 2.0
regime:
  adx_trend: 20
  trend_persist: true        # 상승 중 '눌림(쉬어가기)'을 횡보로 오인하던 문제 수정 → UP 유지.
                             #   검증(라이브): 불장 +1.35%→+3.68%(2.7배), 횡보 +1.61%(유지). 위험 거의 불변.
                             #   근거: 불장도 봉단위론 53~66%가 횡보로 찍혀 추세엔진이 못 타던 걸 교정.
confluence:                  # 다지표 합의 진입 엔진 (사람이 동시에 못 보는 모든 지표를 한 표씩)
  live: true                 # ★ 라이브 AI게이트 하이브리드 ON. 불장아니면 합의(횡보+1.66% 라이브검증),
                             #   불장이면 현행 추세 유지. ※ 모의(paper)로 충분히 관찰 후 실거래 전환 권장.
  enabled: false             # 백테스트 전역 스위치(strategies.evaluate). 일반 백테스트는 현행 엔진
                             #   검증용이라 false 유지. 라이브 하이브리드는 위 live가 제어(별도).
                             #   합의 단독 백테스트는 engine_compare.py / confluence_sweep.py(자체 ON).
  ai_gated: true             # true=AI '불장 아님'일 때만 합의(권장). 불장은 현행 추세가 위험대비 우위.
                             #   false=항상 합의(상승장 MDD 4배 감수). AI 꺼져있으면 tier None=항상 합의.
  threshold: 85              # 진입 점수 문턱(0~100, 50=중립). 높을수록 '한 방' 강한 합의만 진입.
                             #   85=거래수↓·품질↑ (사용자 요청: 거래 많이 말고 제대로 된 한 방).
                             #   스윕(실KRW): 80→횡보+2.9%(PF5.6)/상승+2.5%, 75→횡보+3.1%/상승-0.6%.
  regimes: null              # 합의가 담당할 '봉단위' 국면. null=전 국면(검증된 사용법).
                             #   주의: [SIDEWAYS]처럼 봉단위로 막으면 효과 사라짐 — 횡보장 수익은
                             #   대부분 UP/DOWN으로 '분류된 봉'에서 나오기 때문(봉국면 ≠ 시장국면).
  meanrev_rsi_low: 35        # 평균회귀 그룹: 과매도 기준
  meanrev_rsi_high: 70       #               과매수 기준
  atr_pct_min: 0.002         # 변동성 그룹: ATR/가격 적정 하한(이하=움직임 고갈)
  atr_pct_max: 0.030         #              적정 상한(초과=과변동, 중립)
  indicators:
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    stoch_k: 14
    stoch_d: 3
    vol_ma: 20
    obv_ema: 20
  weights:                   # 국면별 그룹 가중치 — 상승장=추세↑, 횡보장=평균회귀↑
    UP:       {trend: 2.0, momentum: 1.5, meanrev: 0.0, volatility: 0.5, volume: 1.0}
    SIDEWAYS: {trend: 0.5, momentum: 1.0, meanrev: 2.0, volatility: 0.5, volume: 1.0}
    DOWN:     {trend: 1.0, momentum: 1.0, meanrev: 1.5, volatility: 0.5, volume: 1.0}
  exits:                     # 진입 후 청산: 국면별(상승=트레일로 길게, 그 외=고정 익절/손절)
    UP:       {mode: trail, sl_pct: 0.02, trail_pct: 0.04}
    SIDEWAYS: {mode: fixed, tp_pct: 0.006, sl_pct: 0.010}
    DOWN:     {mode: fixed, tp_pct: 0.006, sl_pct: 0.008}
scalp:
  min_profit_buffer: 0.002
  max_hold_bars: 480
  confirm_bars: 3
  exec_mode: limit           # ★V2 새틀 체결방식: limit(지정가=슬리피지 회피, 미체결 가능) | market(시장가)
                             #   지정가 효과는 실거래에서만 체감(모의는 슬리피지 0). 검증: 알트 -0.3%→+4.1%
  limit_ttl_bars: 2          #   지정가 대기 봉수(이 안에 가격 안 닿으면 취소=놓침). 15분봉 기준 2봉=30분
  exit_on_down: true         # DOWN 확정전환 시 보유분 즉시청산(=V1 '청산 후 대기'). false=홀드(약세장 최악)
  bull_mode:                 # AI=BULL 확신도에 따라 상승장 강도 3단(강함/적당/그외). 약세/횡보엔 적용 안 됨.
    enabled: true            #   근거(BTC/USD 프록시): 불장 적용 시 보수대비 큰 폭 개선. AI게이트로만 분기.
    min_confidence: 60       # 이 미만이면 보수(박스/방어). 60~strong 사이=적당(중도), strong 이상=강함(공격)
    strong_confidence: 75    # 이 이상 확신이면 풀 공격
    require_adx_rising: false # [강함] 진입필터 완화 → 추세 적극 참여
    trail_pct: 0.05          # [강함] 트레일 넓게(승자 길게) — KRW 불장 실검증: 4%+2.49→6%+3.36%/코인(넓을수록↑)
                             #   6%는 단일구간 과적합 우려→robust 균형 5%. 손절 2%가 적정(더 좁히면 좋은추세 조기컷)
    hold_through_down: true  # [강함] 눌림목 DOWN플립에 홀드(안 팖)
    pyramid: true            # [강함] 불타기 ON: 남은 보루(75%)를 '오르는 승자'에 추가 투입
                             #   검증(BTC 불장): 단일50만 +4.6%/MDD-2.3 → 불타기 +9.7%/MDD-4.2 (위험대비 최고)
    pyramid_step: 0.03       #   직전 진입가 +3% 추가상승마다 1트랜치 (robust 튜닝: 8구간 전부+ , 수익/MDD 2.47)
                             #   (적당/약한 상승엔 미적용=보루 유지)
    moderate:                # [적당] 60~75 확신: 강함과 '같은 로직' + 작은 베팅(25%)으로 신중.
                             #   ※수정전 신중설정(ADX필터+DOWN청산+좁은trail)이 진짜 불장서도 휩쏘 자해.
                             #     검증(불장): 셋 다 풀자 -0.77%→+2.51%, 낙폭 -5.4%→-3.1% (수익↑·위험↓ 동시).
                             #     신중함은 'size_mult=1(25%)+불타기 없음'으로 충분. 진입로직 망칠 필요 없음.
      require_adx_rising: false  #   (수정) ADX필터 끔 — 국소꼭대기 늦은매수 유발하던 범인
      trail_pct: 0.05            #   (수정) 0.03→0.05: 눌림에 덜 털리게 넓게
      hold_through_down: true    #   (수정) 눌림 홀드 — 계단식 상승의 쉬는구간에 안 털림
      size_mult: 1.0             #   투입 25%(1트랜치). 신중함은 여기서(작게 베팅). 1=25%,4=100%
      pyramid: false             #   노는 75% 불타기 투입? 검증(불장): ON시 +2.51→+3.68%지만 낙폭
                                 #   -3.1→-9.6%(3배). 위험대비 OFF가 2배 우위 → 기본 OFF(완충 유지).
                                 #   노는 자본의 진짜 최적 활용=중장기 추세엔진 배분(별도).
  uptrend:                   # 상승장 진입 (검증결과 trail이 fixed 30조합 전부 이김)
    enabled: true
    mode: trail              # trail=추세 길게 타기(승자) | fixed=작게 자주먹기
    require_adx_rising: true  # 추세 강해지는 중(ADX↑)일 때만 진입=가짜추세 컷.
                              #   상승장 +1.85→+2.45%, 약세장 -3.30→-2.11% 둘다 개선
    pyramid: false           # 불타기(오르는 포지션에 추가매수). 구현완료·검증결과 15m 구간선
                             #   OFF와 동률~손해(촘촘하면 트레일에 더 깎임)→기본 OFF. 강추세 검증 후 ON 고려
    pyramid_step: 0.04       # ON일 때: 직전 진입가 +4% 추가상승마다 1트랜치(촘촘하면 역효과)
    sl_pct: 0.02             # 초기 손절 -2%
    trail_pct: 0.025         # 고점 대비 -2.5% 되돌림에 청산(승자를 길게)
    tp_pct: 0.011            # fixed 모드용 익절(미사용)
  sideways:                  # 횡보장: 그리드(칸칸이 발라먹기) — 라이브 기본. 박스(range)는 백테스트/대안.
    mode: range              # 백테스트 엔진용(range=박스). 라이브는 아래 grid_enabled가 우선.
    grid_enabled: false      # OFF: 횡보는 합의(confluence)엔진이 담당(검증: 합의 +1.62% vs 그리드 -0.46%).
                             #   합의가 우선이라 어차피 안 돌았음 → 혼동방지 위해 명시적 OFF. (합의 끄면 그리드 부활)
    grid_step: 0.012         #   칸 간격 1.2%(매수 -1.2%마다, 매도 +1.2% 반등마다)
    grid_levels: 8           #   최대 8칸(종목당 200만÷8=25만/칸)
    grid_stop: 0.05          #   최저매수가 -5% 이탈 시 전량청산(범위붕괴=가방 회피)
    require_bounce: true     # (박스 range모드용) 하단 '직전봉 고가 돌파' 반등확인 진입.
    box_lookback: 40
    min_box_pct: 0.015
    max_box_pct: 0.06
    entry_zone: 0.25         # 박스 하단 진입(0.35는 약세장↑ 상승장↓ 트레이드오프→상승보존 위해 0.25)
    tp_zone: 0.9             # 박스 상단 목표(단, quick_tp_pct로 더 작게 캡)
    quick_tp_pct: 0.005      # 빠른 익절: 수수료 넘으면 +0.5%서 바로 턴다(작게 자주, 손실일 차단)
    sl_below: 0.004
    tp_pct: 0.005
    sl_pct: 0.004
    rsi_buy: 32
    require_above_slow: true
  downtrend:                 # 하락장(DOWN): 관망/대기 (신규진입 없음, SIDEWAYS 복귀까지 현금)
    enabled: false           # V1 채택: DOWN 과매도반등(칼받기) 끔 → BTC프록시 약세장 일손실 -0.094→-0.052%,
                             #   횡보장도 개선·상승장 영향미미. 박스(SIDEWAYS) 수익엔진은 유지. exit_on_down=true와 함께.
                             #   (true로 켜면: 깊은과매도 RSI22 반등단타 +3% — KRW검증선 '작지만+'였음)
    tp_pct: 0.03             # +3% 목표 (작게잡으면 수수료+가끔손절에 깨짐)
    sl_pct: 0.008            # 손절 -0.8%
    rsi_buy: 22              # 깊은 과매도에서만(27→22). 얕으면 반등실패로 대량손실
portfolio:
  total_krw: 20000000        # 총자본 2,000만원
  per_coin_krw: 833000       # ★V2 새틀=알트6: 25%(500만)÷6알트 = 종목당 83만. (코어는 longterm=전체10)
                             #   비율 75/25 유지(ratio_optimize). V2서 새틀 종목이 10→6(알트)이라 종목당↑.
                             #   원래 200만 단일운영 시 이 값을 2000000으로. 분할비율 바꾸려면 여기+longterm 조정.
  tickers:                   # 원화마켓 시총/거래량 상위 메이저 10
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  - KRW-ADA
  - KRW-DOGE
  - KRW-TRX
  - KRW-LINK
  - KRW-AVAX
  - KRW-DOT
  tranches: 4                # 4분할 균등 (종목당 50만원씩) — 상승/약세 균형점
                             #   3분할=상승최적(+2.14/-2.17), 5분할=약세최적(+1.28/-1.47)
  add_drop_pct: 0.02         # 물타기(평단↓) 트리거: 직전가 -2% 하락+신호 시 추가매수.
                             #   ⚠️ 현재 라이브에선 휴면 — 횡보를 그리드로 운용(grid_step이 진짜 물타기).
                             #      검증: 1.5~5% 바꿔도 결과 동일(미작동). grid_enabled=false(박스모드)나
                             #      portfolio.py 백테스트에서만 활성 → 삭제 않고 보존. 횡보 간격조절은 grid_step.
  tp_pct: 0.02               # 평단가 대비 익절(+2%)
  hard_sl_pct: 0.06          # 모든 트랜치 소진 후에만 작동하는 평단가 대비 방어 손절(-6%)
  max_hold_bars: 480         # 보유 한도(타임아웃 청산)
selector:                    # 동적 종목 선별 — 매 주기 '한 방' 후보 상위 K만 신규진입(비활성=청산만)
  enabled: false             # ON: 유니버스 중 변동성조정 모멘텀 상위 top_k만 매매. OFF=전체 매매.
                             #   (기본 OFF=안정 분산 유지. 동적 집중은 '한방'이라 안정목표와 충돌)
  top_k: 3                   # 활성 종목수. 실측(signal_scan): 불장은 1이 최강(+1.57%p)·횡보 위험,
                             #   2=최균형(불+0.94/횡+0.33%p), 3=안정(둘다 양수). '한방' 원하면 2 권장.
  period: 96                 # 모멘텀 측정 구간(봉). 15분봉 96 = 1일.
  rebalance_hours: 24        # 재선별 주기(시간). 너무 잦으면 회전비용↑, 너무 길면 추세 놓침.
  universe:                  # ★V2 새틀 유니버스 = 알트6만(평균회귀 엣지). 메이저4는 코어가 추세로 담당.
                             #   근거: 메이저는 추세라 스캘프 엣지 없음(슬립0도 -7%), 알트는 출렁여 +엣지.
                             #   분리=종목·스타일 안 겹쳐 진짜 보완. (코어는 longterm.tickers로 전체10 유지)
  - KRW-ADA
  - KRW-DOGE
  - KRW-TRX
  - KRW-LINK
  - KRW-AVAX
  - KRW-DOT
longterm:                    # 중장기 추세추종 엔진(일봉) — 단타봇과 별도 자본·상태로 병행(충돌 없음)
  enabled: true              # 검증(일봉 3년): +76%/낙폭33% vs 그냥보유 +8%/72%. 하락장 자동회피.
  per_coin_krw: 3750000      # ★V2.1 코어=메이저4만: 종목당 375만 (×4 = 1,500만, 75%). 알트는 새틀 전담.
                             #   근거(backtest_period): 코어는 알트서 휩쏘 적자(약세 -6%), 메이저만은 +2%/낙폭↓.
                             #   추세추종은 메이저(깔끔한 추세)에 강하고, 출렁이는 알트는 새틀(평균회귀)이 맞음.
  tickers:                   # ★V2.1 코어 = 메이저4만(추세추종). 알트6은 새틀(selector.universe)이 담당.
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  entry_n: 50                # 진입: 최근 50일 고점 돌파
  exit_n: 20                 # 청산: 최근 20일 저점 이탈
  atr_k: 3.0                 # 청산: 고점 − ATR×3 (샹들리에 손절)
  ma_n: 200                  # 200일선 위(상승추세)에서만 진입
  interval_sec: 3600         # 1시간마다 체크(일봉이라 충분, 저빈도)
slippage:                    # 백테스트 현실화 — 편도 슬리피지(매수 +비싸게/매도 -싸게). 유동성↑=작게
  enabled: true              # 호가창 두께·체결지연 추정치. 실거래 비용 = 수수료 + 이 슬리피지
  default_pct: 0.0015        # 미지정 코인 기본(편도 0.15%)
  by_coin:                   # 코인별 편도 슬리피지(메이저=얇게, 소형알트=두껍게)
    KRW-BTC: 0.0005
    KRW-ETH: 0.0005
    KRW-XRP: 0.0008
    KRW-SOL: 0.0008
    KRW-ADA: 0.0010
    KRW-DOGE: 0.0010
    KRW-TRX: 0.0012
    KRW-LINK: 0.0012
    KRW-AVAX: 0.0015
    KRW-DOT: 0.0015
paper:
  initial_krw: 1000000
upbit:
  access_key: ''
  secret_key: ''
safety:                      # 운영 안전망 — 차단기(run_all.py 감시스레드가 합산자산으로 작동)
  enabled: true
  max_drawdown_pct: 0.15     # 합산자산 고점대비 -15% → 신규진입 전면중단(보유분은 전략대로 청산)
  max_daily_loss_pct: 0.05   # 당일 -5% → 신규진입 중단(다음 거래일 자동 해제)
  poll_sec: 30               # 감시 주기(초): 합산자산 점검·알림
  heartbeat_min: 60          # 생존신호 주기(분, 0=끔) — 봇이 살아있는지 텔레그램으로 통지
telegram:                    # 알림 — 체결·에러·차단·생존. 미설정이면 자동 no-op(끔)
  enabled: false             # true + 토큰/챗ID 있어야 전송. 키는 환경변수 TELEGRAM_BOT_TOKEN/CHAT_ID 권장
  bot_token: ''              # @BotFather 로 봇 생성 후 토큰
  chat_id: ''                # 본인 챗 ID (@userinfobot 등으로 확인)
  notify_trades: true        # 매수/매도 체결 알림
  notify_errors: true        # 엔진 오류 알림
capitulation:                # ★ 폭락엣지(무상관 보너스 엔진) — 거래량 항복 폭락 후 반등 단타
  enabled: true              # 검증: 코어와 상관 0.01 → 합체 +29.6%→+36.5%(위험 거의 안 늘고)
  budget_krw: 2000000        # 공유 풀(폭락 때만 투입, 90% 현금 대기). 총자본 내 배분은 조절
  drop_pct: 0.20             # 폭락 기준: drop_days일 -20%↓
  drop_days: 5
  vol_mult: 2.0              # ★거래량 > 20일평균×2 (진짜 패닉항복만 — MDD 14%→2%의 핵심)
  tp_pct: 0.04               # 익절 +4%
  hold_days: 5               # 최대 보유(반등 안 오면 청산)
  max_pos: 2                 # 동시보유(각 budget/2씩 = 집중). 수익/낙폭 최적
  gate_ticker: KRW-BTC       # 시장 게이트(약세=200일선 아래+하락중 → 진입 중단=칼받기 회피)
  gate_ma_n: 200
  gate_slope_n: 20
  interval_sec: 3600         # 1시간 체크(일봉 신호라 충분)
  tickers:                   # 폭락 스캔 유니버스(전체 10 — 이벤트 많을수록 좋음)
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  - KRW-ADA
  - KRW-DOGE
  - KRW-TRX
  - KRW-LINK
  - KRW-AVAX
  - KRW-DOT
skim:                        # ★ 번 돈 적립(현금흐름 C) — 고점 기준 수익 절반 적립
  enabled: true              # 합산자산 새 고점마다 초과분의 ratio 적립(약세장엔 0=원금보호)
  ratio: 0.5                 # 번 것의 50% 적립(빼 쓸 돈) / 50%는 복리. 70/30 등 조절 가능
  principal_krw: 20000000    # 원금 기준점(2,000만). 이 위로 번 것만 적립 대상
sideways:                    # ★ 횡보 범위 평균회귀(검증된 무상관 횡보 엔진 — 그리드 대체)
  enabled: true              # 연속 15분봉 3년: CAGR+20% MDD-17%, 전·후반 양수, 10코인 전부 양수
  budget_krw: 3000000        # 공유 풀(박스 신호 때만 투입, 평소 현금). max_pos로 분산
  bb_n: 20                   # 평균/밴드 기간(15분×20 = 5시간)
  bb_k: 2.5                  # 밴드 폭(σ 배수) — 깊은 이탈(-2.5σ)만 매수(상위 1% 과매도)
  bbw_q: 0.8                 # 밴드폭 < 평소(100봉)평균×0.8 → 변동성 수축(진짜 박스)
  slope_max: 0.02            # 평균선 기울기 < 2%(평탄=방향성 없음)
  ma200_buf: 0.95            # ★종가 > MA200×0.95 (하락장 칼받기 차단 — 그리드 사망원인 제거)
  stop_pct: 0.05             # 진입가 -5% 깨지면 범위붕괴 → 즉시 손절
  max_hold_bars: 20          # 최대 보유 20봉(5시간) — 안 돌아오면 정리
  max_pos: 6                 # 동시보유 6(분산 → 실 MDD -17%)
  interval_sec: 300          # 5분 체크(15분봉 신호)
