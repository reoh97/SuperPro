<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperPro — 코어/새틀라이트 통합</title>
<style>
  :root { color-scheme: dark; }
  body { font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
         background:#0e1116; color:#e6e6e6; margin:0; padding:20px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { color:#8b949e; font-size:12px; margin-bottom:14px; }
  .topbar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .totcard { background:#11161f; border:1px solid #2a313d; border-radius:10px; padding:10px 16px; }
  .totcard .label { color:#8b949e; font-size:11px; }
  .totcard .value { font-size:19px; font-weight:700; margin-top:2px; }
  .cols { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  @media (max-width:1100px){ .cols { grid-template-columns:1fr; } }
  .panel { background:#12161d; border:1px solid #262d38; border-radius:12px; padding:16px; }
  .panel.sat { border-top:3px solid #58a6ff; }
  .panel.core { border-top:3px solid #d29922; }
  .panel.cap { border-top:3px solid #f85149; }
  .phead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .phead h2 { font-size:16px; margin:0; }
  .ptag { font-size:11px; color:#8b949e; }
  .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0; }
  .card { background:#171b22; border:1px solid #272d38; border-radius:9px; padding:10px 12px; }
  .card .label { color:#8b949e; font-size:11px; }
  .card .value { font-size:17px; font-weight:600; margin-top:3px; }
  .pos { color:#3fb950; } .neg { color:#f85149; }
  .row { display:flex; align-items:center; gap:8px; margin:10px 0; flex-wrap:wrap; }
  button { background:#238636; color:#fff; border:0; padding:7px 14px; border-radius:7px;
           font-size:13px; cursor:pointer; }
  button.stop { background:#da3633; } button:disabled { opacity:.45; cursor:default; }
  .badge { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .on { background:#143d2b; color:#3fb950; } .off { background:#3d1414; color:#f85149; }
  .mode { background:#1f2a3d; color:#58a6ff; }
  .bull { background:#143d2b; color:#3fb950; } .side { background:#3d3414; color:#e3b341; }
  .bear { background:#3d1414; color:#f85149; }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  th, td { text-align:right; padding:5px 7px; border-bottom:1px solid #21262d; }
  th:first-child, td:first-child { text-align:left; }
  th { color:#8b949e; font-weight:600; }
  .buy { color:#58a6ff; } .sell { color:#f0883e; }
  .muted { color:#8b949e; } .err { color:#f85149; font-size:11px; margin-top:6px; white-space:pre-wrap; }
  .regChip { font-size:10px; padding:1px 6px; border-radius:5px; }
  .holdDot { color:#3fb950; } .flatDot { color:#56606b; }
  h3 { font-size:13px; margin:16px 0 2px; color:#c9d1d9; }
  .aiBox { background:#141922; border:1px solid #262d38; border-radius:9px; padding:10px 12px; margin-top:6px;
           font-size:12px; line-height:1.5; }
</style>
</head>
<body>
  <h1>SuperPro 통합 대시보드</h1>
  <div class="sub"><b style="color:#d29922">코어</b>(추세) · <b style="color:#f85149">폭락엣지</b>(무상관) · <b style="color:#58a6ff">새틀</b>(알트) ·
    <span id="mode" class="badge mode">-</span> · 갱신 <span id="updated" class="muted">-</span></div>

  <div class="topbar">
    <div class="totcard"><div class="label">합산 평가자산</div><div class="value" id="totEquity">-</div></div>
    <div class="totcard"><div class="label">합산 손익</div><div class="value" id="totPnl">-</div></div>
    <div class="totcard"><div class="label">합산 실현손익</div><div class="value" id="totReal">-</div></div>
    <div class="totcard"><div class="label">💰 적립금(인출가능)</div><div class="value pos" id="reserve">-</div></div>
  </div>

  <div class="cols">
    <div class="panel core" id="panel-core"></div>
    <div class="panel cap" id="panel-capitulation"></div>
    <div class="panel sat" id="panel-satellite"></div>
  </div>

<script>
const won = n => (n==null) ? "-" : Math.round(n).toLocaleString("ko-KR") + "원";
const cls = n => (n>0) ? "pos" : (n<0) ? "neg" : "";
const sign = n => (n==null) ? "-" : (n>0?"+":"") + won(n);
const pct = n => (n==null) ? "" : ` (${n>=0?"+":""}${n.toFixed(2)}%)`;
const REG = { UP:["상승","bull"], SIDEWAYS:["횡보","side"], DOWN:["하락","bear"] };
const MKT = { BULL:["🟢 상승장","bull"], SIDEWAYS:["🟡 횡보장","side"], BEAR:["🔴 하락장","bear"] };

function summaryCards(o){
  return `<div class="cards">
    <div class="card"><div class="label">평가자산</div><div class="value">${won(o.equity)}</div></div>
    <div class="card"><div class="label">손익</div><div class="value ${cls(o.pnl)}">${sign(o.pnl)}<span style="font-size:12px">${pct(o.ret_pct)}</span></div></div>
    <div class="card"><div class="label">실현손익</div><div class="value ${cls(o.realized)}">${sign(o.realized)}</div></div>
    <div class="card"><div class="label">배정자본</div><div class="value">${won(o.budget)}</div></div>
  </div>`;
}
function coinRows(coins){
  if(!coins||!coins.length) return '<tr><td colspan="7" class="muted">종목 없음</td></tr>';
  return coins.map(c=>{
    const reg = c.regime ? (REG[c.regime]||["-","muted"]) : null;
    return `<tr>
      <td><strong>${c.sym}</strong></td>
      <td>${won(c.price)}</td>
      <td>${reg ? `<span class="regChip ${reg[1]}">${reg[0]}</span>` : '<span class="muted">-</span>'}</td>
      <td>${c.holding ? `<span class="holdDot">●</span> ${c.info||""}` : '<span class="flatDot">○</span>'}</td>
      <td>${c.holding ? won(c.avg) : "-"}</td>
      <td class="${cls(c.unrl)}">${c.holding ? sign(c.unrl) : "-"}</td>
      <td class="${cls(c.realized)}">${sign(c.realized)}</td>
    </tr>`;
  }).join("");
}
function tradeRows(coins){
  const all=[];
  (coins||[]).forEach(c=> (c.recent_trades||[]).forEach(x=>all.push({...x, sym:c.sym})));
  all.sort((a,b)=> (a.time<b.time?1:-1));
  if(!all.length) return '<tr><td colspan="6" class="muted">거래 없음</td></tr>';
  return all.slice(0,8).map(x=>`<tr>
    <td>${(x.time||"").slice(5)}</td>
    <td>${x.sym}</td>
    <td class="${x.side}">${x.side==="buy"?"매수":"매도"}</td>
    <td>${won(x.price)}</td>
    <td class="${cls(x.pnl)}">${x.pnl==null?"-":sign(x.pnl)}</td>
    <td class="muted">${x.reason||""}</td>
  </tr>`).join("");
}
function renderPanel(id, o){
  const runBadge = `<span class="badge ${o.running?"on":"off"}">${o.running?"가동중":"정지"}</span>`;
  document.getElementById("panel-"+id).innerHTML = `
    <div class="phead"><h2>${o.title}</h2>${runBadge}<span class="ptag">${o.subtitle}</span></div>
    ${o.extra||""}
    ${summaryCards(o)}
    <div class="row">
      <button onclick="ctrl('${id}','start')" ${o.running?"disabled":""}>시작</button>
      <button class="stop" onclick="ctrl('${id}','stop')" ${o.running?"":"disabled"}>정지</button>
    </div>
    <h3>종목별 현황</h3>
    <table><thead><tr><th>종목</th><th>현재가</th><th>국면</th><th>보유</th><th>평단</th><th>평가손익</th><th>실현</th></tr></thead>
      <tbody>${coinRows(o.coins)}</tbody></table>
    ${o.error?`<div class="err">오류: ${o.error}</div>`:""}
    <h3>최근 거래</h3>
    <table><thead><tr><th>시각</th><th>종목</th><th>구분</th><th>체결가</th><th>손익</th><th>사유</th></tr></thead>
      <tbody>${tradeRows(o.coins)}</tbody></table>`;
}

function normSat(s){
  const t=s.total||{}, ai=s.ai_regime||{};
  let aiHtml='';
  if(ai.enabled && ai.regime && MKT[ai.regime]){
    const [txt,c]=MKT[ai.regime];
    aiHtml=`<div class="aiBox"><b>AI 장세:</b> ${txt} <span class="muted">확신 ${ai.confidence}%</span>`
      +(ai.risk_off?` <span class="badge bear">⚠️위험회피</span>`:"")
      +`<br><span class="muted">${ai.reason||""}</span></div>`;
  } else {
    aiHtml=`<div class="aiBox muted">AI 장세: ${ai.enabled?"판단 대기...":(ai.disabled_reason||"미사용")}</div>`;
  }
  const gateCls = s.entries_allowed ? (s.gate&&s.gate.includes("방어")?"side":"on") : "off";
  aiHtml += `<div style="margin-top:6px"><span class="badge ${gateCls}">진입: ${s.gate||(s.entries_allowed?"정상":"중단")}</span></div>`;
  return {
    title:"🛰 새틀라이트", subtitle:"단기 전술 · AI게이트", running:s.running, error:s.last_error, extra:aiHtml,
    equity:t.equity, pnl:t.pnl, ret_pct:t.ret_pct, realized:t.realized, budget:t.budget,
    coins:(s.coins||[]).map(c=>({sym:c.ticker.replace("KRW-",""), price:c.price, regime:c.confirmed,
      holding:c.has_position, info:(c.exit_mode||"")+(c.tranches_used?` ${c.tranches_used}회`:""),
      avg:c.avg_price, unrl:c.unrealized, realized:c.realized, recent_trades:c.recent_trades})),
  };
}
function normCore(s){
  const extra=`<div class="aiBox muted">중장기 추세추종(일봉 돈키언): 200일선 위 + 50일 고점 돌파 진입 / 20일 저점·샹들리에 청산. 하락장 자동회피.</div>`;
  return {
    title:"🪨 코어", subtitle:"중장기 추세추종 · 일봉", running:s.running, error:s.error, extra,
    equity:s.total_equity, pnl:(s.total_equity-s.total_base), ret_pct:s.total_pnl_pct,
    realized:s.total_realized, budget:s.total_base,
    coins:(s.coins||[]).map(c=>({sym:c.ticker.replace("KRW-",""), price:c.price, regime:null,
      holding:c.holding, info:"보유", avg:c.avg, unrl:c.unrealized, realized:c.realized,
      recent_trades:c.recent_trades})),
  };
}
function normCapit(s){
  const gate = s.mkt_bear ? `<span class="badge bear">🔴약세 정지(칼받기 회피)</span>` : `<span class="badge on">🟢정상(폭락 대기중)</span>`;
  const extra=`<div class="aiBox">${gate} 보유 ${s.n_positions||0}<br><span class="muted">거래량 항복 폭락(-20%·거래량2배) 후 반등 단타. 90% 현금 대기, 코어와 무상관 보너스.</span></div>`;
  return {
    title:"💥 폭락엣지", subtitle:"무상관 · 거래량 항복", running:s.running, error:s.error, extra,
    equity:s.total_equity, pnl:(s.total_equity-s.total_base), ret_pct:s.total_pnl_pct,
    realized:s.total_realized, budget:s.total_base,
    coins:(s.coins||[]).map(c=>({sym:c.ticker.replace("KRW-",""), price:c.price, regime:null,
      holding:c.holding, info:`${c.hold_left}일남음`, avg:c.avg, unrl:c.unrealized, realized:c.realized,
      recent_trades:c.recent_trades})),
  };
}

async function refresh(){
  try{
    const s = await (await fetch("/api/status")).json();
    const sat=normSat(s.satellite||{}), core=normCore(s.core||{}), cap=normCapit(s.capitulation||{});
    document.getElementById("mode").textContent = (s.satellite&&s.satellite.mode)==="live"?"실거래":"모의";
    document.getElementById("updated").textContent = (s.core&&s.core.last_update)||(s.satellite&&s.satellite.last_update)||"-";
    // 합산(3엔진)
    const eq=(sat.equity||0)+(core.equity||0)+(cap.equity||0), pnl=(sat.pnl||0)+(core.pnl||0)+(cap.pnl||0);
    const real=(sat.realized||0)+(core.realized||0)+(cap.realized||0), bud=(sat.budget||0)+(core.budget||0)+(cap.budget||0);
    document.getElementById("totEquity").textContent=won(eq);
    const tp=document.getElementById("totPnl"); tp.textContent=sign(pnl)+pct(bud?pnl/bud*100:null); tp.className="value "+cls(pnl);
    const tr=document.getElementById("totReal"); tr.textContent=sign(real); tr.className="value "+cls(real);
    const sk=s.skim||{}; document.getElementById("reserve").textContent = sk.enabled ? won(sk.reserve) : "꺼짐";
    renderPanel("core", core);
    renderPanel("capitulation", cap);
    renderPanel("satellite", sat);
  }catch(e){
    document.getElementById("totEquity").textContent="연결 실패";
  }
}
async function ctrl(who, action){ await fetch(`/api/${who}/${action}`,{method:"POST"}); refresh(); }
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
